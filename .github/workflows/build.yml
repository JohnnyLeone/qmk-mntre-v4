name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # Catch upstream QMK changes that break the port.
  schedule:
    - cron: "17 4 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    permissions:
      contents: write # create releases for tags
    steps:
      - uses: actions/checkout@v4

      - name: Check out qmk_firmware
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          path: qmk_firmware
          submodules: recursive

      - name: Prepare
        run: |
          git config --global --add safe.directory '*'
          cp -r keyboards/mntre_v4 qmk_firmware/keyboards/

      # Lint the keyboard as it would be submitted upstream, before the
      # out-of-tree via keymap is added.
      - name: Lint
        working-directory: qmk_firmware
        run: qmk lint -kb mntre_v4 --strict

      - name: Compile
        working-directory: qmk_firmware
        run: |
          cp -r ../keymaps/via keyboards/mntre_v4/keymaps/
          mkdir -p ../dist
          # Each variant from a clean object directory, as the make
          # variables change compile flags.
          build() {
            out="$1"; shift
            rm -rf .build/obj_mntre_v4_*
            make "$@"
            mv mntre_v4_*.uf2 "../dist/$out"
          }
          build mntre_v4-laptop.uf2 mntre_v4:default
          build mntre_v4-standalone.uf2 mntre_v4:default REFORM4_SYSCTL=no
          build mntre_v4-laptop-via.uf2 mntre_v4:via
          build mntre_v4-standalone-via.uf2 mntre_v4:via REFORM4_SYSCTL=no
          cp ../via/mntre_v4.json ../dist/
          cd ../dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: mntre_v4-firmware
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: .github/release-notes.md
          generate_release_notes: true
